  reporting, not an official release. That is precisely the failure mode here: real
  activity, no official announcement naming both.


  QUANTIFICATION. Monte Carlo decomposition: P(any genre announcement in window) ×
  P(covers both | announcement) × P(meets ''materially expanded'' fine print) + additive
  lenient-resolution allowance. Baseline genre rate 0.8-2.0/yr over a 24/365 window,
