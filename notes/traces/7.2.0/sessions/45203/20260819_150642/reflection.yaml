assessment: 'STEP 1 PARSE. Resolves YES only if, strictly between Aug 10 and Sept
  3, 2026 ET, a U.S. FEDERAL AGENCY OFFICIALLY ANNOUNCES new or materially expanded
  voluntary agreements under which a federal agency evaluates frontier models from
