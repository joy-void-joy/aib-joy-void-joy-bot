  it.


  THE CORE TENSION. Two forces point opposite ways. (1) Activity is unusually high:
  EO 14409 (June 2, 2026) mandated a voluntary pre-release review framework; it was
  finalized around the Aug 1 deadline; labs were briefed Aug 4; implementation is
  beginning. In a normal world that raises the odds of a follow-on agency announcement.
  (2) But this specific program has an explicitly documented anti-publication posture.
  Fortune and Axios both reported on Aug 4 that the White House has NO plans to publicly
  release the framework — details stay ''under wraps, only known to a select group
  of companies.'' Benchmarks and covered-model thresholds are classified. WSJ reported
  CAISI was told to stop publishing its model assessments. The Aug 1 statutory deliverables
  lapsed with zero public output. Force (2) is much better evidenced and directly
