  is stable — it does not swing wildly under reasonable reparameterization.


  NO SCENARIO (concrete, ~95%): The framework stays classified. Companies participate
  quietly under the already-existing arrangements. CAISI, still under an acting dual-hatted
  director, publishes nothing about OpenAI or Anthropic through Sept 3. Congress keeps
