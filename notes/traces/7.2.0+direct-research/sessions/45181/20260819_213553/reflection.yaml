process_reflection: 'The scaffolding fit this question well because the decisive move
  was cheap and early: find out what the principals said most recently about timing.
  Exa''s date-stamped results made that a two-call job, and the Spanish-language query
  was what unlocked it — the English-language search returned only generic 123-agreement
  background and would have left me anchored on the question description alone. A
  prompt nudge to query in the subject country''s language for bilateral/foreign-policy
  questions would generalise well.


  Friction points. (1) The system prompt describes a research() tool and an entire
  Phase 2a delegation workflow, but no such tool exists in my actual toolset — dead
  weight I had to notice and route around. Same for the "Threshold Questions" guidance,
  which doesn''t bind on a pure event-timing question; subforecast() exists but was
  inapplicable (no continuous quantity to decompose). (2) AskNews 403''d entirely,
  costing me the recency sweep I''d normally use to confirm nothing broke in the last
  72 hours; I substituted a livecrawl Exa query, adequate but a weaker recency guarantee.
  (3) A "what diplomatic events are scheduled between date X and date Y for country
  pair (A,B)" tool would have collapsed three calendar searches into one — the single
  most reusable missing capability for treaty/summit-timing questions. I had to reconstruct
  the calendar by hand from five separate Argentine news articles.


  What worked better than expected: forcing the question into a date-distribution
  rather than a YES/NO narrative. Writing the two-stage model made the sensitivity
  explicit (ceiling of 13% even under maximally generous assumptions), which is far
  more defensible than asserting "low probability." The reflection schema''s separation
  of anchor from factors also caught something I''d otherwise have fudged — my constant-hazard
  anchor of 9.9% genuinely differs from my 5% answer, and stating both forced me to
  justify the gap rather than silently presenting 5% as if it fell out of a base rate.'
